<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta property="og:type" content="article">
    <meta property="og:title" content="Recorta imagenes online">
    <meta property="og:url" content="https://unimage.netlify.app">
    <meta property="og:image" content="https://unimage.netlify.app/img/unDrawPlus_1712366214221_mq0wdt.webp">
    <meta property="og:description" content="Recorta imagenes de forma fácil y sencilla">
    <meta name="description" content="Recorta imagenes de forma fácil y sencilla">
    <title>Recortando imágenes</title>
    <link rel="shortcut icon" href="./img/undraw_moments_0y20.svg" type="image/x-icon">
    <link rel="stylesheet" href="/css/styles.css">
    <!-- For editor importation styles of cropper -->
    <link rel="stylesheet" href="./css/croppr.min.css" />
    <link rel="stylesheet" href="./css/jquery-ui.css">
    <!-- font -->
    <link href="./css/font.css" rel="stylesheet">

</head>

<body>
    <header>
        <div>
            <h1>unImage
                <img width="40" src="./img/undraw_moments_0y20.svg" alt="Logo" title="Logo">
            </h1>

        </div>
        <div>
            <img src="./img/avataaars.svg" alt="Avatar" title="Avatar">

        </div>
    </header>

    <main>
        <div>
            <h1 class="title">Selecciona tu imagen y recorta...</h1>

        </div>
        <div>
            <img class="image" width="100%" height="300px" src="./img/unDrawPlus_1712366214221_mq0wdtresize.webp"
                alt="example">
        </div>
    </main>


    <form id="form" name="form">
        <div class="contentInputByImage">
            <Label for="image">Introduce tu imagen</Label>
            <!-- Input file where push image -->
            <input type="file" id="image" accept=".png, .jpg, jpeg" required>
        </div>


        <div id="modal-full" class="uk-modal-full" uk-modal>
            <div class="uk-modal-dialog">
                <button class="uk-modal-close-full uk-close-large" type="button" uk-close></button>
                <div id="isGridAuto" class="uk-grid-collapse uk-child-width-1-2@s uk-flex-middle" uk-grid>
                    <div class="uk-background-cover uk-padding-large">
                        <h1>Recorta</h1>
                        <!-- Editor where  resize the image with  help of cropper.js -->
                        <div id="editor"></div>

                    </div>
                    <div class="uk-padding-large">
                        <h1>Previsualiza el resultado</h1>
                        <!-- Preview of image resized -->
                        <canvas id="preview"></canvas>
                    </div>
                </div>
                <div align="center">
                    <a id="base"><button type="submit"> Descargar imagen </button> </a>
                    <br>
                </div>
            </div>
        </div>



    </form>

    <script src="./js/croppr.min.js"></script>
    <script src="./js/jquery.js"></script>
    <script src="./js/jquery-ui.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/uikit.min.js"></script>
</body>

</html>
